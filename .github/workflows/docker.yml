name: Docker Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push GHCR Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules via SSH deploy key
        env:
          SSH_KEY: ${{ secrets.AIMCAP_SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519_submodule
            chmod 600 ~/.ssh/id_ed25519_submodule
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_submodule -o StrictHostKeyChecking=no"
            git submodule sync --recursive
            git submodule update --init --recursive
            rm -f ~/.ssh/id_ed25519_submodule
          else
            git submodule update --init --recursive || true
          fi

      - name: Free disk space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          echo "Disk space after cleanup:"
          df -h

      - name: Determine short SHA and image name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="${{ github.sha }}"
          fi
          SHA_SHORT=$(git rev-parse --short=7 "$HEAD_SHA")
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and retag existing PR image on merge
        id: retag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_IMAGE="ghcr.io/${{ steps.vars.outputs.repo_lower }}"
          TARGET_SHA="${{ steps.vars.outputs.sha_short }}"

          # Check candidate tags: PR branch commit (HEAD^2) if merge commit, or HEAD
          CANDIDATES=()
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            CANDIDATES+=("$(git rev-parse --short=7 HEAD^2)")
          fi
          CANDIDATES+=("$(git rev-parse --short=7 HEAD)")

          RETAGGED="false"
          for SOURCE_TAG in "${CANDIDATES[@]}"; do
            echo "Checking if $REPO_IMAGE:$SOURCE_TAG exists on GHCR..."
            if docker buildx imagetools inspect "$REPO_IMAGE:$SOURCE_TAG" >/dev/null 2>&1; then
              echo "Found pre-built image $REPO_IMAGE:$SOURCE_TAG! Retagging without rebuild..."
              docker buildx imagetools create \
                --tag "$REPO_IMAGE:latest" \
                --tag "$REPO_IMAGE:$TARGET_SHA" \
                "$REPO_IMAGE:$SOURCE_TAG"
              RETAGGED="true"
              break
            fi
          done

          echo "retagged=${RETAGGED}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        if: steps.retag.outputs.retagged != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.repo_lower }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_short }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=glim
            org.opencontainers.image.description=GLIM standalone MCAP SLAM runner and web visualizer
            org.opencontainers.image.revision=${{ steps.vars.outputs.head_sha }}
            slam-eval.tool=glim

      - name: Build and push Docker image
        if: steps.retag.outputs.retagged != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.head_sha }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.vars.outputs.repo_lower }}:latest
          cache-to: type=gha,mode=max
